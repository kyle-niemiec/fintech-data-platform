AWSTemplateFormatVersion: "2010-09-09"
Description: Meridian demo launcher CloudFront and Route53 edge resources.

Parameters:
  DomainName:
    Type: String
  OriginDomainName:
    Type: String
  AcmCertificateArn:
    Type: String
  HostedZoneId:
    Type: String
    Default: ""
  LauncherLandingBucketName:
    Type: String

Conditions:
  HasHostedZoneId: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # Create the CloudFront distribution with two origins (EC2 app and S3 launcher) and origin failover config.
  DemoCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Meridian demo launcher with same-domain origin failover.
        # Keep it cheap af, boi
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:

          # Define the primary origin pointing to the EC2 app
          - Id: ec2-app-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only

          # Define the secondary origin pointing to the S3 launcher site for failover
          - Id: s3-launcher-origin
            DomainName: !Sub "${LauncherLandingBucketName}.s3-website.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only

        OriginGroups:
          Quantity: 1
          Items:

            # Define the origin group for failover between the EC2 app and S3 launcher
            - Id: app-with-launcher-failover
              FailoverCriteria:
                StatusCodes:
                  Quantity: 4
                  Items:
                    - 500
                    - 502
                    - 503
                    - 504
              Members:
                Quantity: 2
                Items:
                  - OriginId: ec2-app-origin
                  - OriginId: s3-launcher-origin

        DefaultCacheBehavior:
          TargetOriginId: app-with-launcher-failover
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad           # CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # AllViewerExceptHostHeader
        CacheBehaviors:

          # Add a behavior for the `/assets` path to enable caching
          - PathPattern: /assets/*
            TargetOriginId: app-with-launcher-failover
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6         # CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin

          # Add a behavior for the `/ui` path to disable caching
          - PathPattern: /ui/*
            TargetOriginId: app-with-launcher-failover
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad         # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

          # Add a behavior for the `/api` path to disable caching
          - PathPattern: /api/*
            TargetOriginId: app-with-launcher-failover
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad         # CachingDisabled 
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader 

  # Create a Route53 A record alias to point the demo domain to the CloudFront distribution.
  DemoDnsAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZoneId
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DemoCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontDistributionId:
    Value: !Ref DemoCloudFrontDistribution
  CloudFrontDistributionDomainName:
    Value: !GetAtt DemoCloudFrontDistribution.DomainName
