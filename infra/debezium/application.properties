# Debezium Server configuration: Postgres (pgoutput) source -> Kafka (Redpanda) sink.
# Single publication/slot pair; all trading.* tables are rerouted onto the
# canonical cdc.oltp.raw.v1 topic so downstream contracts stay stable as
# tables are added or renamed at the source.

debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=${REDPANDA_BOOTSTRAP_SERVERS}
debezium.sink.kafka.producer.security.protocol=PLAINTEXT
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.client.id=debezium-server-cdc
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

debezium.format.key=json
debezium.format.value=json

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=5000

debezium.source.database.hostname=oltp_db
debezium.source.database.port=${OLTP_DB_PORT}
debezium.source.database.user=${OLTP_REPLICATION_USER}
debezium.source.database.password=${OLTP_REPLICATION_PASSWORD}
debezium.source.database.dbname=${OLTP_DB}
debezium.source.topic.prefix=cdc.oltp

debezium.source.plugin.name=pgoutput
debezium.source.publication.name=cdc_pub
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=cdc_slot
debezium.source.snapshot.mode=initial

debezium.source.table.include.list=trading.transaction,trading.risk_flag
debezium.source.schema.include.list=trading
debezium.source.tombstones.on.delete=false

# Reroute all per-table topics (cdc.oltp.trading.transaction, ...) onto the
# single canonical raw topic; key SMT produces "<schema>.<table>:<pk>" so
# partitioning colocates all events for a given business key.
debezium.source.transforms=Reroute,KeyCompose
debezium.source.transforms.Reroute.type=io.debezium.transforms.ByLogicalTableRouter
debezium.source.transforms.Reroute.topic.regex=cdc\\.oltp\\.trading\\.(.*)
debezium.source.transforms.Reroute.topic.replacement=cdc.oltp.raw.v1
debezium.source.transforms.Reroute.key.enforce.uniqueness=false

debezium.source.transforms.KeyCompose.type=org.apache.kafka.connect.transforms.ReplaceField$Key
# No-op placeholder; the ByLogicalTableRouter preserves existing PK keys per
# source table. Downstream consumers should compose "<source_table>:<pk>"
# themselves from the envelope when they need cross-table colocation.
debezium.source.transforms.KeyCompose.include=

quarkus.log.console.json=false
quarkus.log.level=INFO
