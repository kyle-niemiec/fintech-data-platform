services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/ui-api/Dockerfile
      network: host
    container_name: fintech_api
    restart: unless-stopped
    environment:
      EVENT_STORE_DB: ${EVENT_STORE_DB}
      EVENT_STORE_DB_HOST: event_store_db
      EVENT_STORE_DB_PORT: ${EVENT_STORE_DB_PORT}
      EVENT_QUERY_DB_USER: ${EVENT_QUERY_DB_USER}
      EVENT_QUERY_DB_PASSWORD: ${EVENT_QUERY_DB_PASSWORD}
      OLTP_DB: ${OLTP_DB}
      OLTP_DB_HOST: oltp_db
      OLTP_DB_PORT: ${OLTP_DB_PORT}
      OLTP_UI_READER_USER: ${OLTP_UI_READER_USER}
      OLTP_UI_READER_PASSWORD: ${OLTP_UI_READER_PASSWORD}
      OLTP_DEMO_WRITER_USER: ${OLTP_DEMO_WRITER_USER}
      OLTP_DEMO_WRITER_PASSWORD: ${OLTP_DEMO_WRITER_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_SECRET: ${MINIO_INGEST_SECRET}
      MINIO_LANDING_BUCKET: ${MINIO_BUCKET_NAME}
      UI_ORIGIN: ${UI_ORIGIN:-https://meridian.codeflower.io}
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-meridian}
      KEYCLOAK_DEMO_SERVICE_CLIENT_ID: ${KEYCLOAK_DEMO_SERVICE_CLIENT_ID:-meridian-demo-service}
      KEYCLOAK_DEMO_SERVICE_CLIENT_SECRET: ${KEYCLOAK_DEMO_SERVICE_CLIENT_SECRET}
      KEYCLOAK_FINANCE_ROLE: ${KEYCLOAK_FINANCE_ROLE:-finance}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      REDPANDA_SECURITY_PROTOCOL: ${REDPANDA_SECURITY_PROTOCOL:-PLAINTEXT}
      REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-SCRAM-SHA-256}
      REDPANDA_UI_SERVICE_USER: ${REDPANDA_UI_SERVICE_USER:-}
      REDPANDA_UI_SERVICE_PASSWORD: ${REDPANDA_UI_SERVICE_PASSWORD:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      event_store_db:
        condition: service_healthy
    networks:
      - platform_internal
      - platform_public
