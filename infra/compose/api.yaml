services:
  api:
    build:
      context: ..
      dockerfile: services/ui-api/Dockerfile
      network: host
    container_name: fintech_api
    restart: unless-stopped
    environment:
      EVENT_STORE_DB: ${EVENT_STORE_DB}
      EVENT_STORE_DB_HOST: event_store_db
      EVENT_STORE_DB_PORT: ${EVENT_STORE_DB_PORT}
      EVENT_QUERY_DB_USER: ${EVENT_QUERY_DB_USER}
      EVENT_QUERY_DB_PASSWORD: ${EVENT_QUERY_DB_PASSWORD}
      OLTP_DB: ${OLTP_DB}
      OLTP_DB_HOST: oltp_db
      OLTP_DB_PORT: ${OLTP_DB_PORT}
      OLTP_UI_READER_USER: ${OLTP_UI_READER_USER}
      OLTP_UI_READER_PASSWORD: ${OLTP_UI_READER_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_SECRET: ${MINIO_INGEST_SECRET}
      MINIO_LANDING_BUCKET: ${MINIO_BUCKET_NAME}
      UI_ORIGIN: ${UI_ORIGIN:-http://localhost:3000}
      DEMO_FINANCE_USERS: ${DEMO_FINANCE_USERS:-james.beringer@meridian.example.com,kathy.winston@meridian.example.com,alex.ortiz@meridian.example.com}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../services/ui-api:/app
    depends_on:
      event_store_db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - platform_internal
      - platform_public
