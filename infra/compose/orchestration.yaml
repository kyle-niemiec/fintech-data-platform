services:
  # The airflow_postgres service stores DAG definitions, task states, and other Airflow metadata.
  airflow_postgres:
    image: postgres:16
    container_name: fintech_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - platform_internal

  # The airflow_init service initializes the Airflow metadata database, creates an admin user, and sets up necessary connections.
  airflow_init:
    build:
      context: ..
      dockerfile: services/pipeline-orchestrator/Dockerfile
      network: host
    container_name: fintech_airflow_init
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        : "${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER must be set}"
        : "${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD must be set}"

        airflow db migrate

        if ! airflow users list | grep -q "${AIRFLOW_ADMIN_USER}"; then
          airflow users create \
            --username "${AIRFLOW_ADMIN_USER}" \
            --firstname Meridian \
            --lastname Admin \
            --role Admin \
            --email admin@meridian.local \
            --password "${AIRFLOW_ADMIN_PASSWORD}"
        fi

        # Curated-pipeline listener connection (Kafka) + transform connection (Trino).
        # Idempotent: delete-then-add so password rotations take effect.
        airflow connections delete kafka_default >/dev/null 2>&1 || true
        airflow connections add kafka_default \
          --conn-type kafka \
          --conn-extra "$(python - <<'PY'
        import json, os
        extra = {
            "bootstrap.servers": os.environ["REDPANDA_BOOTSTRAP_SERVERS"],
            "security.protocol": os.environ.get("REDPANDA_SECURITY_PROTOCOL", "PLAINTEXT"),
            "group.id": "airflow-curated-silver-v1",
            "auto.offset.reset": "earliest",
            "enable.auto.commit": "false",
        }
        if extra["security.protocol"] != "PLAINTEXT":
            extra["sasl.mechanism"] = os.environ.get("REDPANDA_SASL_MECHANISM", "SCRAM-SHA-256")
            extra["sasl.username"] = os.environ["REDPANDA_ORCHESTRATOR_SERVICE_USER"]
            extra["sasl.password"] = os.environ["REDPANDA_ORCHESTRATOR_SERVICE_PASSWORD"]
        print(json.dumps(extra))
        PY
        )"

        airflow connections delete trino_default >/dev/null 2>&1 || true
        airflow connections add trino_default \
          --conn-type trino \
          --conn-host trino \
          --conn-port 8080 \
          --conn-login trino_etl \
          --conn-schema silver
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_postgres/${AIRFLOW_DB}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS}
      REDPANDA_AIRFLOW_USER: ${REDPANDA_AIRFLOW_USER}
      REDPANDA_AIRFLOW_PASSWORD: ${REDPANDA_AIRFLOW_PASSWORD}
      REDPANDA_ORCHESTRATOR_SERVICE_USER: ${REDPANDA_ORCHESTRATOR_SERVICE_USER}
      REDPANDA_ORCHESTRATOR_SERVICE_PASSWORD: ${REDPANDA_ORCHESTRATOR_SERVICE_PASSWORD}
      REDPANDA_SECURITY_PROTOCOL: ${REDPANDA_SECURITY_PROTOCOL:-PLAINTEXT}
      REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-SCRAM-SHA-256}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_SECRET: ${MINIO_INGEST_SECRET}
      MINIO_VALIDATION_USER: ${MINIO_VALIDATION_USER}
      MINIO_VALIDATION_SECRET: ${MINIO_VALIDATION_SECRET}
      MINIO_TRINO_WRITE_USER: ${MINIO_TRINO_WRITE_USER}
      MINIO_TRINO_WRITE_SECRET: ${MINIO_TRINO_WRITE_SECRET}
      MINIO_KMS_KEY_ID: ${MINIO_KMS_KEY_ID}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      PLATFORM_MASKING_SALT: ${PLATFORM_MASKING_SALT}
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: trino_etl
      SALESFORCE_BASE_URL: ${SALESFORCE_BASE_URL:-http://salesforce_mock:8080}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET}
      SALESFORCE_API_VERSION: ${SALESFORCE_API_VERSION:-v59.0}
      SALESFORCE_PAGE_SIZE: ${SALESFORCE_PAGE_SIZE:-200}
      SALESFORCE_SOBJECTS: ${SALESFORCE_SOBJECTS:-Account,Contact,Opportunity}
      EVENT_STORE_DB: ${EVENT_STORE_DB}
      EVENT_STORE_DB_HOST: event_store_db
      EVENT_STORE_DB_PORT: ${EVENT_STORE_DB_PORT}
      EVENT_APPEND_DB_USER: ${EVENT_APPEND_DB_USER}
      EVENT_APPEND_DB_PASSWORD: ${EVENT_APPEND_DB_PASSWORD}
    depends_on:
      airflow_postgres:
        condition: service_healthy
    networks:
      - platform_internal

  # The airflow_scheduler service runs scheduled DAGs and manages task execution.
  airflow_scheduler:
    build:
      context: ..
      dockerfile: services/pipeline-orchestrator/Dockerfile
      network: host
    container_name: fintech_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    environment: *airflow_env
    depends_on:
      airflow_init:
        condition: service_completed_successfully
      trino_curated_init:
        condition: service_completed_successfully
      event_store_db:
        condition: service_healthy
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - platform_internal

  # The airflow_triggerer service is responsible for triggering tasks from Kafka events.
  airflow_triggerer:
    build:
      context: ..
      dockerfile: services/pipeline-orchestrator/Dockerfile
      network: host
    container_name: fintech_airflow_triggerer
    restart: unless-stopped
    command: triggerer
    environment: *airflow_env
    depends_on:
      airflow_init:
        condition: service_completed_successfully
      trino_curated_init:
        condition: service_completed_successfully
      event_store_db:
        condition: service_healthy
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - platform_internal

  # The airflow_webserver service provides the Airflow UI for monitoring DAGs and task execution.
  airflow_webserver:
    build:
      context: ..
      dockerfile: services/pipeline-orchestrator/Dockerfile
      network: host
    container_name: fintech_airflow_webserver
    restart: unless-stopped
    command: webserver
    environment: *airflow_env
    depends_on:
      airflow_init:
        condition: service_completed_successfully
      trino_curated_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "8080:8080"
    networks:
      - platform_internal
      - platform_public
