services:
  ui:
    build:
      context: ..
      dockerfile: infra/docker/ui/Dockerfile
      network: host
      args:
        VITE_API_URL: ${UI_API_URL:-}
        VITE_RELEASE_TAG: ${VITE_RELEASE_TAG:-}
    container_name: fintech_ui
    restart: unless-stopped
    ports:
      - "443:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - platform_public
