services:
  # The iceberg-rest service is used by Trino to interact with the Iceberg catalog
  iceberg_rest:
    image: tabulario/iceberg-rest:1.5.0
    container_name: fintech_iceberg_rest
    restart: unless-stopped
    environment:
      CATALOG_WAREHOUSE: s3://${MINIO_BUCKET_NAME}/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_TRINO_WRITE_USER}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_TRINO_WRITE_SECRET}
      CATALOG_S3_SSE_TYPE: kms
      CATALOG_S3_SSE_KEY: ${MINIO_KMS_KEY_ID}
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=iceberg
      CATALOG_JDBC_USER: ${ICEBERG_CATALOG_OWNER_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_CATALOG_OWNER_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          perl -MIO::Socket::INET -e '
            my $$sock=IO::Socket::INET->new(
              PeerAddr=>"127.0.0.1",
              PeerPort=>8181,
              Proto=>"tcp",
              Timeout=>2
            ) or exit 1;

            print $$sock "GET /v1/config HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n";
            my $$ok=0;

            while (my $$line=<$$sock>) {
              if ($$line =~ m{^HTTP/\d+\.\d+ 200\b}) {
                $$ok=1;
                last;
              }
            }

            exit($$ok ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - platform_internal

  # The Trino service is used to query the Iceberg catalog and perform transformations
  trino:
    image: trinodb/trino:442
    container_name: fintech_trino
    restart: unless-stopped
    environment:
      MINIO_TRINO_WRITE_USER: ${MINIO_TRINO_WRITE_USER}
      MINIO_TRINO_WRITE_SECRET: ${MINIO_TRINO_WRITE_SECRET}
      MINIO_KMS_KEY_ID: ${MINIO_KMS_KEY_ID}
    volumes:
      - ./trino/etc:/etc/trino:ro
    depends_on:
      iceberg_rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - platform_internal

  # The trino_curated_init service runs initial SQL migrations to set up the curated layer in the Iceberg catalog.
  trino_curated_init:
    image: trinodb/trino:442
    container_name: fintech_trino_curated_init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        set -- /lakehouse-migrations/[0-9][0-9]_*.sql
        if [ "$$1" = "/lakehouse-migrations/[0-9][0-9]_*.sql" ]; then
          echo "No lakehouse migration SQL files found under /lakehouse-migrations." >&2
          exit 1
        fi

        for migration_file in "$$@"; do
          echo "Applying migration $$migration_file"
          /usr/bin/trino --server http://trino:8080 --catalog lakehouse --user trino_etl --file "$$migration_file"
        done
    volumes:
      - ./db/lakehouse-migrations:/lakehouse-migrations:ro
    depends_on:
      trino:
        condition: service_healthy
    networks:
      - platform_internal
