services:
  oltp_db:
    image: postgres:16
    container_name: fintech_oltp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OLTP_DB}
      POSTGRES_USER: ${OLTP_ROOT_USER}
      POSTGRES_PASSWORD: ${OLTP_ROOT_PASSWORD}
      OLTP_APP_USER: ${OLTP_APP_USER}
      OLTP_APP_PASSWORD: ${OLTP_APP_PASSWORD}
      OLTP_REPLICATION_USER: ${OLTP_REPLICATION_USER}
      OLTP_REPLICATION_PASSWORD: ${OLTP_REPLICATION_PASSWORD}
      OLTP_UI_READER_USER: ${OLTP_UI_READER_USER}
      OLTP_UI_READER_PASSWORD: ${OLTP_UI_READER_PASSWORD}
    command:
      - postgres
      - -p
      - "${OLTP_DB_PORT}"
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - oltp_data:/var/lib/postgresql/data
      - ../db/oltp-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_ROOT_USER} -d ${OLTP_DB} -p ${OLTP_DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform_internal

  oltp_load_generator:
    build:
      context: ..
      dockerfile: services/pipeline-workers/workers/oltp_load_generator/Dockerfile
      network: host
    container_name: fintech_oltp_load_generator
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLTP_DB_HOST: oltp_db
      OLTP_DB_PORT: ${OLTP_DB_PORT}
      OLTP_DB: ${OLTP_DB}
      OLTP_APP_USER: ${OLTP_APP_USER}
      OLTP_APP_PASSWORD: ${OLTP_APP_PASSWORD}
      OLTP_LOAD_GEN_INTERVAL_MS: ${OLTP_LOAD_GEN_INTERVAL_MS:-60000}
      OLTP_LOAD_GEN_FRAUD_FRACTION: ${OLTP_LOAD_GEN_FRAUD_FRACTION:-0.25}
    depends_on:
      oltp_db:
        condition: service_healthy
    networks:
      - platform_internal

  debezium_server:
    image: debezium/server:2.7.3.Final
    container_name: fintech_debezium_server
    restart: unless-stopped
    environment:
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS}
      REDPANDA_CDC_SERVICE_USER: ${REDPANDA_CDC_SERVICE_USER}
      REDPANDA_CDC_SERVICE_PASSWORD: ${REDPANDA_CDC_SERVICE_PASSWORD}
      OLTP_DB: ${OLTP_DB}
      OLTP_REPLICATION_USER: ${OLTP_REPLICATION_USER}
      OLTP_REPLICATION_PASSWORD: ${OLTP_REPLICATION_PASSWORD}
    volumes:
      - ../debezium/application.properties:/debezium/config/application.properties:ro
      - debezium_offsets:/debezium/data
    depends_on:
      oltp_db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - platform_internal

  fraud_worker:
    build:
      context: ..
      dockerfile: services/pipeline-workers/workers/fraud_worker/Dockerfile
      network: host
    container_name: fintech_fraud_worker
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS}
      REDPANDA_FRAUD_SERVICE_USER: ${REDPANDA_FRAUD_SERVICE_USER}
      REDPANDA_FRAUD_SERVICE_PASSWORD: ${REDPANDA_FRAUD_SERVICE_PASSWORD}
      REDPANDA_SECURITY_PROTOCOL: ${REDPANDA_SECURITY_PROTOCOL:-PLAINTEXT}
      REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-SCRAM-SHA-256}
      OLTP_DB_HOST: oltp_db
      OLTP_DB_PORT: ${OLTP_DB_PORT}
      OLTP_DB: ${OLTP_DB}
      OLTP_APP_USER: ${OLTP_APP_USER}
      OLTP_APP_PASSWORD: ${OLTP_APP_PASSWORD}
      EVENT_STORE_DB: ${EVENT_STORE_DB}
      EVENT_STORE_DB_HOST: event_store_db
      EVENT_STORE_DB_PORT: ${EVENT_STORE_DB_PORT}
      EVENT_APPEND_DB_USER: ${EVENT_APPEND_DB_USER}
      EVENT_APPEND_DB_PASSWORD: ${EVENT_APPEND_DB_PASSWORD}
    depends_on:
      oltp_db:
        condition: service_healthy
      event_store_db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - platform_internal

  cdc_bronze_writer:
    build:
      context: ..
      dockerfile: services/pipeline-workers/workers/cdc_bronze_writer/Dockerfile
      network: host
    container_name: fintech_cdc_bronze_writer
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS}
      REDPANDA_FRAUD_SERVICE_USER: ${REDPANDA_FRAUD_SERVICE_USER}
      REDPANDA_FRAUD_SERVICE_PASSWORD: ${REDPANDA_FRAUD_SERVICE_PASSWORD}
      REDPANDA_SECURITY_PROTOCOL: ${REDPANDA_SECURITY_PROTOCOL:-PLAINTEXT}
      REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-SCRAM-SHA-256}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_TRANSFORM_USER: ${MINIO_TRANSFORM_USER}
      MINIO_TRANSFORM_SECRET: ${MINIO_TRANSFORM_SECRET}
      MINIO_KMS_KEY_ID: ${MINIO_KMS_KEY_ID}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      CDC_BATCH_MAX_RECORDS: ${CDC_BATCH_MAX_RECORDS:-100}
      CDC_BATCH_MAX_SECONDS: ${CDC_BATCH_MAX_SECONDS:-30}
      EVENT_STORE_DB: ${EVENT_STORE_DB}
      EVENT_STORE_DB_HOST: event_store_db
      EVENT_STORE_DB_PORT: ${EVENT_STORE_DB_PORT}
      EVENT_APPEND_DB_USER: ${EVENT_APPEND_DB_USER}
      EVENT_APPEND_DB_PASSWORD: ${EVENT_APPEND_DB_PASSWORD}
    depends_on:
      event_store_db:
        condition: service_healthy
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - platform_internal
