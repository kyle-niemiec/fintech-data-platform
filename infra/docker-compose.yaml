services:
  postgres:
    image: postgres:16
    container_name: fintech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_internal

  event_store_db:
    image: postgres:16
    container_name: fintech_event_store
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVENT_STORE_DB}
      POSTGRES_USER: ${EVENT_STORE_DB_ROOT_USER}
      POSTGRES_PASSWORD: ${EVENT_STORE_DB_ROOT_PASSWORD}
    command: ["postgres", "-p", "${EVENT_STORE_DB_PORT}"]
    volumes:
      - event_store_data:/var/lib/postgresql/data
      - ./db/event-store-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENT_STORE_DB_ROOT_USER} -d ${EVENT_STORE_DB} -p ${EVENT_STORE_DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_internal

  minio:
    image: minio/minio:latest
    container_name: fintech_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - platform_internal

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: fintech_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - platform_internal

  terraform_runner:
    build:
      context: ..
      dockerfile: infra/terraform-runner/Dockerfile
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ../:/workspace
    entrypoint: ["/workspace/infra/terraform-runner/run-terraform.sh"]
    env_file:
      - ./.env
    environment:
      TF_IN_AUTOMATION: "1"
    networks:
      - platform_internal
      - platform_public

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fintech_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_internal
      - platform_public

volumes:
  postgres_data:
  event_store_data:
  minio_data:
  redpanda_data:

networks:
  platform_public:
    driver: bridge
  platform_internal:
    driver: bridge
    internal: true
