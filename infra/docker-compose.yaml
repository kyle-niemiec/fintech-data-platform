services:
  # Define the PostgreSQL service
  postgres:
    image: postgres:16
    container_name: fintech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      OPERATOR_DB_USER: ${OPERATOR_DB_USER}
      OPERATOR_DB_PASSWORD: ${OPERATOR_DB_PASSWORD}
      OBSERVER_DB_USER: ${OBSERVER_DB_USER}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD}
      PIPELINE_DB_USER: ${PIPELINE_DB_USER}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  # Define the Minio service
  minio:
    image: minio/minio:latest
    container_name: fintech_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data: