name: Integration Nightly

on:
  schedule:
    - cron: "30 08 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Docker Hub (optional)
        uses: ./.github/actions/dockerhub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run full integration stack
        run: bash infra/ops/run_integration_stack.sh
