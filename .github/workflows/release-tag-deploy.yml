name: Release Tag Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag is not semantic vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi

      - name: Ensure tag commit is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag commit ${GITHUB_SHA} is not reachable from origin/main" >&2
            exit 1
          fi

  integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: validate-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full integration gate
        run: bash infra/ops/run_integration_stack.sh

  launcher-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: integration-gate
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      MERIDIAN_EC2_INSTANCE_ID: ${{ vars.MERIDIAN_EC2_INSTANCE_ID }}
      MERIDIAN_HOSTED_DOMAIN: ${{ vars.MERIDIAN_HOSTED_DOMAIN }}
      MERIDIAN_LAUNCHER_STACK_NAME: ${{ vars.MERIDIAN_LAUNCHER_STACK_NAME }}
      MERIDIAN_LAUNCHER_ARTIFACT_BUCKET: ${{ vars.MERIDIAN_LAUNCHER_ARTIFACT_BUCKET }}
      MERIDIAN_ORIGIN_DOMAIN: ${{ vars.MERIDIAN_ORIGIN_DOMAIN }}
      MERIDIAN_ACM_CERT_ARN: ${{ vars.MERIDIAN_ACM_CERT_ARN }}
      MERIDIAN_DEMO_TTL_MINUTES: ${{ vars.MERIDIAN_DEMO_TTL_MINUTES }}
      MERIDIAN_HOSTED_ZONE_ID: ${{ vars.MERIDIAN_HOSTED_ZONE_ID }}
      MERIDIAN_ORIGIN_HEALTHCHECK_URL: ${{ vars.MERIDIAN_ORIGIN_HEALTHCHECK_URL }}
      MERIDIAN_SCHEDULER_GROUP: ${{ vars.MERIDIAN_SCHEDULER_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect launcher infra changes
        id: detect
        run: |
          set -euo pipefail

          STACK_NAME="${MERIDIAN_LAUNCHER_STACK_NAME:-meridian-demo-launcher}"
          stack_exists=true
          if ! aws --region "${AWS_REGION}" cloudformation describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            stack_exists=false
          fi

          previous_tag="$(git tag --merged "${GITHUB_SHA}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -Fxv "${GITHUB_REF_NAME}" | head -n1 || true)"

          launcher_changed=false
          if [ -z "$previous_tag" ]; then
            launcher_changed=true
          elif git diff --name-only "$previous_tag" "${GITHUB_REF_NAME}" -- \
            infra/cloudformation \
            infra/ops/deploy_demo_launcher_stack.sh \
            .github/workflows/release-tag-deploy.yml | grep -q .; then
            launcher_changed=true
          fi

          should_apply=false
          if [ "$stack_exists" = false ] || [ "$launcher_changed" = true ]; then
            should_apply=true
          fi

          echo "stack_name=${STACK_NAME}" >> "$GITHUB_OUTPUT"
          echo "stack_exists=${stack_exists}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "launcher_changed=${launcher_changed}" >> "$GITHUB_OUTPUT"
          echo "should_apply=${should_apply}" >> "$GITHUB_OUTPUT"

          echo "stack_exists=${stack_exists}"
          echo "previous_tag=${previous_tag:-<none>}"
          echo "launcher_changed=${launcher_changed}"
          echo "should_apply=${should_apply}"

      - name: Apply launcher stack and sync landing assets
        if: ${{ steps.detect.outputs.should_apply == 'true' }}
        run: |
          set -euo pipefail
          : "${MERIDIAN_LAUNCHER_ARTIFACT_BUCKET:?Missing repository variable MERIDIAN_LAUNCHER_ARTIFACT_BUCKET}"
          : "${MERIDIAN_ORIGIN_DOMAIN:?Missing repository variable MERIDIAN_ORIGIN_DOMAIN}"
          : "${MERIDIAN_ACM_CERT_ARN:?Missing repository variable MERIDIAN_ACM_CERT_ARN}"
          : "${MERIDIAN_EC2_INSTANCE_ID:?Missing repository variable MERIDIAN_EC2_INSTANCE_ID}"

          MERIDIAN_LAUNCHER_STACK_NAME="${{ steps.detect.outputs.stack_name }}" \
          AWS_REGION="${AWS_REGION}" \
          MERIDIAN_LAUNCHER_ARTIFACT_BUCKET="${MERIDIAN_LAUNCHER_ARTIFACT_BUCKET}" \
          MERIDIAN_HOSTED_DOMAIN="${MERIDIAN_HOSTED_DOMAIN:-meridian.codeflower.io}" \
          MERIDIAN_ORIGIN_DOMAIN="${MERIDIAN_ORIGIN_DOMAIN}" \
          MERIDIAN_ACM_CERT_ARN="${MERIDIAN_ACM_CERT_ARN}" \
          MERIDIAN_EC2_INSTANCE_ID="${MERIDIAN_EC2_INSTANCE_ID}" \
          MERIDIAN_DEMO_TTL_MINUTES="${MERIDIAN_DEMO_TTL_MINUTES:-30}" \
          MERIDIAN_HOSTED_ZONE_ID="${MERIDIAN_HOSTED_ZONE_ID:-}" \
          MERIDIAN_ORIGIN_HEALTHCHECK_URL="${MERIDIAN_ORIGIN_HEALTHCHECK_URL:-}" \
          MERIDIAN_SCHEDULER_GROUP="${MERIDIAN_SCHEDULER_GROUP:-}" \
          bash infra/ops/deploy_demo_launcher_stack.sh

      - name: Skip launcher stack apply
        if: ${{ steps.detect.outputs.should_apply != 'true' }}
        run: echo "Launcher stack unchanged and already present; skipping apply."

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: launcher-infra
    permissions:
      contents: read
      id-token: write
    env:
      MERIDIAN_HOSTED_DOMAIN: ${{ vars.MERIDIAN_HOSTED_DOMAIN }}
      MERIDIAN_EC2_INSTANCE_ID: ${{ vars.MERIDIAN_EC2_INSTANCE_ID }}
      MERIDIAN_CURRENT_TAG_PARAM: ${{ vars.MERIDIAN_CURRENT_TAG_PARAM }}
      MERIDIAN_LAST_GOOD_TAG_PARAM: ${{ vars.MERIDIAN_LAST_GOOD_TAG_PARAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy tag to EC2 via SSM Run Command
        run: |
          : "${MERIDIAN_EC2_INSTANCE_ID:?Missing repository variable MERIDIAN_EC2_INSTANCE_ID}"

          DOMAIN="${MERIDIAN_HOSTED_DOMAIN:-meridian.codeflower.io}"
          CURRENT_PARAM="${MERIDIAN_CURRENT_TAG_PARAM:-/meridian/demo/current_tag}"
          LAST_GOOD_PARAM="${MERIDIAN_LAST_GOOD_TAG_PARAM:-/meridian/demo/last_good_tag}"

          INSTANCE_ID="${MERIDIAN_EC2_INSTANCE_ID}" \
          TAG="${GITHUB_REF_NAME}" \
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
          DOMAIN="${DOMAIN}" \
          AWS_REGION="${AWS_REGION:-us-east-1}" \
          CURRENT_PARAM="${CURRENT_PARAM}" \
          LAST_GOOD_PARAM="${LAST_GOOD_PARAM}" \
          bash infra/ops/ssm_release_deploy.sh
